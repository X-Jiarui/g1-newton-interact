# Staged reward weights, to be applied through the env.yaml override chain.
#
# HOW THESE TAKE EFFECT
#   tools/run/train_newton.py:107
#     apply_reward_weights(cfg, reward_weights_from_env_yaml(<ckpt>/params/env.yaml))
#   The task default in env_cfgs.py is overwritten by this file. Registering a term in env_cfgs.py
#   is NOT enough -- a term absent from here trains at whatever the base cfg says, and terms the
#   base cfg does not define will raise.
#
# BASELINE this replaces (identical across EAT1 / MIX / MIXSB / PARTS):
#   multi_tip_surface 5.0, right_wrist_tracking 3.0, object_trajectory_tracking 2.0,
#   object_lift_hold 2.0, object_hard_lift 2.0, tracking 1.0, contact_duration 1.0,
#   stability 1.0, left_wrist_tracking 0.5, omnigrasp_style 0.5      (10 terms, sum 18.0)
#
# THIS SET: 10 terms, sum 18.5. The magnitude is deliberately close to the baseline so the PPO
# value scale does not shift and a matched-iteration comparison stays honest.

rewards:
  # ---- REPLACED --------------------------------------------------------------------------------
  # tracking (1.0) -> staged_lower_tracking. `tracking` is one Gaussian over the whole body; the
  # upper half of it is exactly what should be released after cf, and it cannot be released
  # separately. The lower body keeps the always-on term: GMR's feet carry the highest IK weights and
  # the upper body needs something to stand on once it is free.
  tracking: {weight: 0.0}
  staged_lower_tracking: {weight: 1.0}

  # right_wrist_tracking (3.0) + left_wrist_tracking (0.5) -> staged_upper_tracking (3.5).
  # Same job, whole upper chain instead of two wrist points, and released after cf where the arm is
  # a means rather than data. post_weight is 0.15 in env_cfgs.py, not 0 -- see the doc.
  right_wrist_tracking: {weight: 0.0}
  left_wrist_tracking: {weight: 0.0}
  staged_upper_tracking: {weight: 3.5}

  # object_trajectory_tracking (2.0) -> staged_object_tracking. Same quantity, plus two gates:
  # active only after cf, and paid only when a fingertip is actually within 6 cm of the object.
  object_trajectory_tracking: {weight: 0.0}
  staged_object_tracking: {weight: 2.0}

  # ---- NEW -------------------------------------------------------------------------------------
  # Nothing in the baseline reads the finger joints. This is the only place the cf grasp solve is
  # spent. See the doc for why joint space and not fingertip positions.
  staged_hand_pose: {weight: 1.0}

  # ---- UNCHANGED -------------------------------------------------------------------------------
  multi_tip_surface: {weight: 5.0}      # see the doc: replacing this is a DOWNGRADE, not a swap
  object_lift_hold: {weight: 2.0}
  object_hard_lift: {weight: 2.0}
  contact_duration: {weight: 1.0}
  stability: {weight: 1.0}
  omnigrasp_style: {weight: 0.5}

  # Registered but left at zero: staged_tip_object. It is a plain Gaussian on tip-to-object-CENTRE
  # with a near-mask, and multi_tip_surface already does that job against the SURFACE with contact,
  # force, grasp and drift gating. Kept in the tree because the close_hand_flag mask in it is worth
  # folding into multi_tip_surface later; not worth losing five weighted sub-terms today.
  staged_tip_object: {weight: 0.0}
