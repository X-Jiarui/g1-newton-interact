# Grasp retargeting: every parameter, and which route is adopted.
#
# Each number below was measured rather than picked, and the measurement is named. Values that were
# tried and rejected are kept with their result, because most of them look reasonable in isolation.
#
# All quality figures: 198 s1 sequences, at each clip's own contact frame (cf).
#   orient / shape   how far the robot's hand frame and finger directions are from the human's own,
#                    in degrees, expressed in the OBJECT frame. Convention-free: both frames come
#                    from the same two physical directions, wrist->fingertip-centroid and
#                    wrist->thumb-tip, so nothing is assumed to be shared between SMPL-X and MJCF.
#   resid            mean distance from each fingertip to the point it should touch, cm.
#   pen              deepest hand-object interpenetration, cm.
#   4+touch          fraction of clips with four or more fingers within 2 cm of the surface.

adopted: mesh_tip_with_orientation

# ---------------------------------------------------------------------------------------------
# step 1  object placement: shrink the object radially about the pelvis until the arm can reach it
# ---------------------------------------------------------------------------------------------
object_placement:
  tool: tools/retarget/shrink_object_radius.py
  mode: adaptive          # per sequence; solves a quadratic for the largest alpha that reaches
  centre: pelvis          # not the shoulder: the shoulder centre is undefined for a hand-over clip
  per_frame: true         # also removes the legacy placement's frame-0 frozen world offset
  margin: 0.03            # metres of reach kept in hand
  # margin sweep, all else equal:
  #   3 cm   orient 27.6  shape 20.4  resid 1.50  pen 0.06  moved 1.23 cm   <- adopted
  #   5 cm   orient 29.1  shape 20.6  resid 1.54  pen 0.06  moved 3.62 cm
  #   7 cm   orient 28.9  shape 21.4  resid 1.65  pen 0.14  moved 6.04 cm
  # Bigger margin is uniformly worse: the extra null space is not pulled toward a human pose by
  # anything, so the solver spends it freely while the object drifts further from where it was.
  #
  # A GLOBAL alpha was measured and rejected. Reachability and displacement are linearly coupled
  # with no cheap region: alpha 0.90 buys 75.5 % reachable at 5.4 cm on every object, 0.80 buys
  # 87.3 % at 10.8 cm, and 100 % needs 0.50, which halves the object's distance from the pelvis.
  # Per-sequence reaches 100 % at a 3.25 cm median with 362/1335 objects untouched.
  # alpha 0.67 (the leg-ratio x reach-ratio product) was tried end to end: objects moved 21.1 cm,
  # residual 3.00 cm, shape error 32.8 deg -- far worse than doing nothing. It pulls the object so
  # close that the arm can no longer retract to meet it.

# ---------------------------------------------------------------------------------------------
# step 2  the fingertip targets
# ---------------------------------------------------------------------------------------------
grasp_targets:
  tool: tools/retarget/extract_grasp_targets.py
  frame: cf               # the first frame GRAB annotates as contact. One frame, defined by the
                          # dataset, used by every stage. A "most fingers touching" heuristic was
                          # used first and dropped: the extractor and the solver each chose their
                          # own, so one instant's hand geometry landed on another's body pose.
  operating_side: nearest_hand_in_human_data
                          # geometric, not by contact-label count: at first contact only a finger
                          # or two is touching and the counts picked the wrong hand on
                          # s1/apple_lift and s1/cubesmall_lift.
  smplx:
    v_template: true      # GRAB personalises with a scanned .ply at body["vtemp"], NOT betas
    flat_hand_mean: false
    # Judged against GRAB's own annotation -- a labelled vertex was touched, so the body surface
    # must be ON it. Distance from the contact patch to the nearest body vertex:
    #   mean shape, flat_hand_mean=True    3.36 cm    <- what this pipeline used at first
    #   mean shape, flat_hand_mean=False   2.56 cm
    #   v_template, flat_hand_mean=True    2.57 cm
    #   v_template, flat_hand_mean=False   0.42 cm    <- correct; the threshold is 2e-5 m

# ---------------------------------------------------------------------------------------------
# step 3  the IK
# ---------------------------------------------------------------------------------------------
arm_ik:
  tool: tools/retarget/solve_arm_ik.py
  solver: newton.ik       # Levenberg-Marquardt, 150 iterations
  iterations: 150
  free_joints: 7 arm + 20 finger joints of the operating side
  frozen: root, both legs, waist, torso, the other arm -- so the shoulder is GMR's
  finger_weights: [3, 3, 3, 1, 1]     # thumb, index, middle high; ring, pinky low
  joint_limit_weight: 50.0

  targets: mesh           # ADOPTED. The human's actual SKIN point at each fingertip, taken from
                          # the SMPL-X mesh: among vertices within 3.5 cm of the distal joint, the
                          # one reaching furthest along the last phalanx. No hand-tuned offset.
  rot_weight: 0.3         # ADOPTED. One palm-orientation objective. Orientation is the one thing
                          # the position-only formulation never optimised, and it was 27.6 deg off.

  # the alternative route, kept because it is what the mesh route replaced
  legacy_route:
    targets: human        # the human's last finger JOINT, pushed along the phalanx
    tip_extend: 0.020     # metres. Absorbs three offsets: the human's joint-to-skin (1.24 cm), the
                          # Wuji tip frame sitting 0.25 cm inside its own collision shell, and the
                          # contact patch being a centroid on a curved surface.
    # tip_extend sweep (no rotation objective):
    #   1.0 cm  orient 27.6  shape 20.4  resid 1.50  pen 0.06  4+touch 51.5 %
    #   1.5 cm  orient 27.7  shape 19.9  resid 1.56  pen 0.22  4+touch 58.1 %
    #   2.0 cm  orient 27.5  shape 19.1  resid 1.65  pen 0.34  4+touch 67.2 %

  # rot_weight sweep, on the joint+2.0 cm route:
  #   0.0   orient 27.5  shape 19.1  resid 1.65  pen 0.34  4+touch 67.2 %
  #   0.3   orient 12.8  shape 12.8  resid 1.49  pen 0.40  4+touch 59.1 %   <- knee
  #   0.6   orient  9.9  shape 10.3  resid 1.90  pen 0.52  4+touch 58.1 %
  #   1.0   orient 10.3  shape 10.1  resid 2.75  pen 0.88  4+touch 57.1 %
  #   3.0   orient 10.0  shape  8.1  resid 6.82  pen 0.84  4+touch 55.6 %

results:
  #                        orient  shape  or<30   sh<30  resid   pen   4+touch
  gmr_no_ik:              [41.9,  16.8,  26.8,  100.0,   null,  0.86,  58.6]
  joint_2cm_no_rot:       [27.5,  19.1,  60.1,   91.4,   1.65,  0.34,  67.2]
  joint_2cm_rot_0p3:      [12.8,  12.8,  87.9,   99.0,   1.49,  0.40,  59.1]
  mesh_tip_no_rot:        [25.6,  18.6,  63.6,   92.4,   1.60,  0.69,  76.8]
  mesh_tip_with_orientation: [12.3, 12.4, 88.9,  99.0,   1.60,  0.55,  71.7]   # ADOPTED
  # 198/198 solved on every row; no arm joint ends within 2 % of a limit on any row.

known_limitations:
  - The IK has NO collision term. newton.ik offers only Position, Rotation and JointLimit
    objectives, so nothing prevents finger-object or finger-finger interpenetration. Median
    penetration 0.55 cm -- lower than the 0.86 cm the retarget already carried, but not fixed.
  - Only the contact frame is solved. The approach and the carry are still GMR's.
  - Reachability is guaranteed at cf only. 52.0 % of clips are reachable with the torso locked
    and no object shift; opening the waist and torso is untested and may remove the need to move
    the object at all.
